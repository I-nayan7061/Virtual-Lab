<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        const div = document.createElement('div');
        div.style.color = '#721c24';
        div.style.padding = '20px';
        div.style.background = '#f8d7da';
        div.style.border = '1px solid #f5c6cb';
        div.style.borderRadius = '8px';
        div.style.margin = '20px';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '14px';
        div.style.whiteSpace = 'pre-wrap';
        div.innerHTML = '<h3 style="margin-top:0;color:#721c24;">JavaScript Error Encountered:</h3>' + 
                        '<b>Message:</b> ' + message + '<br>' +
                        '<b>Source:</b> ' + source + '<br>' +
                        '<b>Line:</b> ' + lineno + ' <b>Col:</b> ' + colno + '<br>' +
                        '<b>Stack:</b> <br>' + (error && error.stack ? error.stack : 'N/A');
        document.body.insertBefore(div, document.body.firstChild);
        return false;
    };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Programming Laboratory</title>
    <meta name="description" content="A formal virtual learning environment for Computer Science programming languages.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.39.0/min/vs/loader.min.js"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
    <link rel="stylesheet" href="style.css?v=1.0.2">

</head>
<body>
    <header class="app-header glass-panel">
        <div class="header-logo">
            <span class="logo-icon">🏛️</span>
            <h1>Virtual Programming Laboratory</h1>
        </div>
        <div class="header-nav">
            <span>Department of Computer Science & Engineering</span>
        </div>
    </header>
    
    <main id="app">
    </main>

    <script src="tracers.js?v=1.0.2"></script>
    <script src="script.js?v=1.0.2" defer></script>
</body>
</html>
