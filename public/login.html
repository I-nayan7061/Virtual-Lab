<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Virtual Labs Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🔬</text></svg>">
</head>
<body>

  <!-- Background Blobs -->
  <div class="background-animation">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <!-- Top Header Navigation -->
  <header class="main-header glass">
    <a href="index.html" class="logo" style="text-decoration:none;">
      <span class="logo-icon">🔬</span>
      <h1>Virtual Labs Platform</h1>
    </a>
    <div style="display:flex; gap:1rem; align-items:center;">
      <button class="btn btn-secondary" id="theme-toggle" onclick="toggleTheme()" style="padding:0.5rem;" title="Toggle Dark/Light Mode">🌙</button>
      <a href="index.html" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
  </header>

  <!-- Login/Register Center Card -->
  <div class="auth-wrapper">
    <div class="auth-card glass">
      
      <!-- Tabs header -->
      <div class="auth-tabs">
        <div class="auth-tab active" id="tab-login-btn" onclick="switchAuthTab('login')">Login</div>
        <div class="auth-tab" id="tab-register-btn" onclick="switchAuthTab('register')">Register</div>
      </div>
      
      <!-- Display Alerts -->
      <div class="auth-alert" id="auth-alert"></div>
      
      <!-- Form 1: Login -->
      <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%; justify-content: center;">Sign In</button>
      </form>
      
      <!-- Form 2: Register -->
      <form class="auth-form" id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
          <label for="reg-roll">Roll Number</label>
          <input type="text" id="reg-roll" placeholder="e.g. MIT2026012" required>
        </div>
        <div class="form-group">
          <label for="reg-pass">Password</label>
          <input type="password" id="reg-pass" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <input type="password" id="reg-confirm" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px; width: 100%; justify-content: center;">Create Account</button>
      </form>


      
    </div>
  </div>

  <script src="js/app.js"></script>
  <script type="module">
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      // Check query parameter to activate tab
      const urlParams = new URLSearchParams(window.location.search);
      const tab = urlParams.get('tab');
      if (tab === 'register') {
        switchAuthTab('register');
      }
    });

    window.switchAuthTab = function(mode) {
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');
      const loginBtn = document.getElementById('tab-login-btn');
      const registerBtn = document.getElementById('tab-register-btn');
      const alertDiv = document.getElementById('auth-alert');

      // Clear alert
      alertDiv.style.display = 'none';
      alertDiv.className = 'auth-alert';

      if (mode === 'login') {
        loginForm.classList.add('active');
        registerForm.classList.remove('active');
        loginBtn.classList.add('active');
        registerBtn.classList.remove('active');
      } else {
        loginForm.classList.remove('active');
        registerForm.classList.add('active');
        loginBtn.classList.remove('active');
        registerBtn.classList.add('active');
      }
    }

    window.showAlert = function(message, type) {
      const alertDiv = document.getElementById('auth-alert');
      alertDiv.textContent = message;
      alertDiv.className = `auth-alert ${type}`;
      alertDiv.style.display = 'block';
    }

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";

    let app, auth;
    try {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
    } catch (err) {
      console.warn("Firebase Auth initialization:", err);
    }

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, pass);
        localStorage.setItem('vlab_user_email', userCredential.user.email);
        showAlert("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 800);
      } catch (err) {
        showAlert(err.message || "Failed to sign in. Please verify credentials.", "danger");
      }
    };

    window.handleRegister = async function(e) {
      e.preventDefault();

      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (pass !== confirm) {
        showAlert("Passwords do not match.", "danger");
        return;
      }

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
        showAlert("Account created successfully! Switching to Login...", "success");
        setTimeout(() => {
          document.getElementById('login-email').value = email;
          switchAuthTab('login');
        }, 1200);
      } catch (err) {
        showAlert(err.message || "Registration failed.", "danger");
      }
    };
  </script>
</body>
</html>
